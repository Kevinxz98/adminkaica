<div class="col-xl-12">
  <div class="card custom-card">
    
    <!-- Header -->
    <div class="card-header d-flex justify-content-between align-items-center">
      <div class="skeleton-box" style="height: 20px; width: 120px;"></div>
      <div class="skeleton-box" style="height: 34px; width: 90px;"></div>
    </div>

    <div class="card-body p-4">
      <div class="row gy-3">

        <!-- Avatar -->
        <div class="col-xl-12">
          <div class="d-flex align-items-start gap-3">
            <div class="skeleton-box rounded-circle" style="width: 96px; height: 96px;"></div>

            <div class="flex-grow-1">
              <div class="skeleton-box mb-2" style="height: 14px; width: 140px;"></div>
              <div class="d-flex gap-2 mb-2">
                <div class="skeleton-box" style="height: 32px; width: 120px;"></div>
                <div class="skeleton-box" style="height: 32px; width: 90px;"></div>
              </div>
              <div class="skeleton-box" style="height: 12px; width: 100%; max-width: 420px;"></div>
            </div>
          </div>
        </div>

        <!-- Input -->
        <div class="col-xl-6">
          <div class="skeleton-box mb-1" style="height: 14px; width: 140px;"></div>
          <div class="skeleton-box" style="height: 38px; width: 100%;"></div>
        </div>

        <div class="col-xl-6">
          <div class="skeleton-box mb-1" style="height: 14px; width: 160px;"></div>
          <div class="skeleton-box" style="height: 38px; width: 100%;"></div>
        </div>

        <div class="col-xl-6">
          <div class="skeleton-box mb-1" style="height: 14px; width: 180px;"></div>
          <div class="skeleton-box" style="height: 38px; width: 100%;"></div>
        </div>

        <div class="col-xl-6">
          <div class="skeleton-box mb-1" style="height: 14px; width: 80px;"></div>
          <div class="skeleton-box" style="height: 38px; width: 100%;"></div>
        </div>

        <!-- Textarea -->
        <div class="col-xl-12">
          <div class="skeleton-box mb-1" style="height: 14px; width: 120px;"></div>
          <div class="skeleton-box" style="height: 80px; width: 100%;"></div>
        </div>

        <!-- Selects -->
        <div class="col-xl-6">
          <div class="skeleton-box mb-1" style="height: 14px; width: 100px;"></div>
          <div class="skeleton-box" style="height: 38px; width: 100%;"></div>
        </div>

        <div class="col-xl-6">
          <div class="skeleton-box mb-1" style="height: 14px; width: 150px;"></div>
          <div class="skeleton-box" style="height: 38px; width: 100%;"></div>
        </div>

        <!-- Footer -->
        <div class="col-xl-12 d-flex justify-content-end mt-3">
          <div class="skeleton-box" style="height: 38px; width: 140px;"></div>
        </div>

      </div>
    </div>
  </div>
</div>
